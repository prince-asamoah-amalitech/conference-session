name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format check
        run: npx prettier --check "src/**/*.{ts,html,css}"

      - name: Typecheck
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx tsc --noEmit -p tsconfig.spec.json

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/conference-sessions/browser
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: conference-sessions:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:80 conference-sessions:ci
          for i in $(seq 1 10); do curl -fs http://localhost:8080/ > /dev/null && break; sleep 1; done
          curl -fs http://localhost:8080/ | grep -q '<app-root'
          # A deep link must fall back to index.html, not 404.
          curl -fs http://localhost:8080/sessions/new | grep -q '<app-root'
          docker rm -f app
