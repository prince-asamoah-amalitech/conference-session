server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes (/sessions/new, /sessions/:id) have no file on disk; fall back to
    # index.html so a refresh or shared link reaches the Angular router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Build output is content-hashed, so it can be cached indefinitely. index.html is not.
    location ~* \.(?:js|css|ico|woff2?|png|svg|jpg|jpeg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
