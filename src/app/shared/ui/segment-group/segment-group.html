<div class="ui-field">
  <span class="ui-label">{{ label() }}</span>

  <div class="flex flex-wrap gap-2" role="radiogroup" [attr.aria-label]="label()">
    @for (option of options(); track option) {
      <label class="ui-segment" [class.ui-segment-active]="selected() === option">
        <input class="sr-only" type="radio" [value]="option" [formControl]="formControl()" />
        {{ option }}
      </label>
    }
  </div>
</div>
