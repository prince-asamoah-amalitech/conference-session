<div class="ui-container max-w-form py-8">
  <a class="text-sm text-content-tertiary" routerLink="/sessions">Back to sessions</a>

  <div class="mt-1 flex flex-wrap items-center justify-between gap-3">
    <h1 class="ui-page-title">New session</h1>
    @if (form.dirty) {
      <span class="ui-badge ui-badge-orange rounded-lg">Unsaved changes</span>
    }
  </div>

  <form class="ui-card mt-6 p-6" [formGroup]="form" (ngSubmit)="submit()">
    <div class="grid gap-5">
      <app-ui-input
        [control]="form.controls.title"
        name="title"
        label="Title"
        placeholder="e.g. Zoneless Angular in production"
        errorText="A title of at most 120 characters is required."
      />

      <app-ui-segment-group [control]="form.controls.track" [options]="tracks" label="Track" />

      <div class="grid gap-5 sm:grid-cols-2">
        <app-ui-input
          [control]="form.controls.startsAt"
          name="startsAt"
          label="Starts at"
          type="datetime-local"
          errorText="A start time is required."
        />

        <app-ui-input
          [control]="form.controls.endsAt"
          name="endsAt"
          label="Ends at"
          type="datetime-local"
          errorText="An end time is required."
        />
      </div>

      @if (form.touched && form.hasError('endBeforeStart')) {
        <small class="ui-error" role="alert">The end time must come after the start time.</small>
      }

      <app-ui-input
        [control]="form.controls.capacity"
        name="capacity"
        label="Capacity"
        type="number"
        [min]="1"
        [max]="10000"
        errorText="Capacity must be a whole number between 1 and 10000."
      />

      <fieldset class="m-0 border-0 p-0">
        <legend class="ui-label mb-2 p-0">Speakers</legend>

        <div class="flex flex-col gap-3">
          @for (speaker of speakers.controls; track $index; let i = $index) {
            <div class="flex flex-col gap-2 sm:flex-row sm:items-start">
              <app-ui-input
                class="flex-1"
                [control]="speaker.get('name')"
                name="name"
                placeholder="Name"
                errorText="A speaker name is required."
              />

              <app-ui-input
                class="flex-1"
                [control]="speaker.get('email')"
                name="email"
                type="email"
                placeholder="Email"
                errorText="A valid email address is required."
              />

              <button
                appButton
                variant="danger-ghost"
                size="sm"
                class="sm:mt-0.5"
                type="button"
                (click)="removeSpeaker(i)"
                [disabled]="speakers.length === 1"
              >
                Remove
              </button>
            </div>
          }
        </div>

        <button
          appButton
          variant="ghost"
          size="sm"
          class="mt-3"
          type="button"
          (click)="addSpeaker()"
        >
          + Add speaker
        </button>
      </fieldset>
    </div>

    <div class="mt-8 flex flex-wrap gap-3">
      <button appButton variant="primary" type="submit">Save session</button>
      <button appButton variant="secondary" type="button" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>

<app-save-changes-dialog
  [open]="showSaveChangesDialog()"
  (decision)="onSaveChangesDecision($event)"
/>
